layout: {zmk_keyboard: forager}
layers:
  BASE:
  - Q
  - W
  - F
  - P
  - B
  - ;
  - J
  - L
  - U
  - Y
  - {t: A, h: LSHFT}
  - R
  - S
  - T
  - G
  - M
  - N
  - E
  - I
  - {t: O, h: RSHFT}
  - {t: Z, h: LCTRL}
  - {t: X, h: LGUI}
  - {t: C, h: LALT}
  - D
  - V
  - K
  - H
  - {t: ',', h: RALT}
  - {t: ., h: RGUI}
  - {t: /, h: RCTRL}
  - BACKSPACE
  - SPACE
  - ENTER
  - {t: NUM, h: toggle}
  NUM:
  - ESC
  - '['
  - UP
  - ']'
  - '*'
  - {t: '-', h: _}
  - {t: '7', h: '&'}
  - {t: '8', h: '*'}
  - {t: '9', h: (}
  - {t: \, h: DEL}
  - {t: TAB, h: LEFT SHIFT}
  - LEFT
  - DOWN
  - RIGHT
  - /
  - {t: '=', h: +}
  - {t: '4', h: $}
  - {t: '5', h: '%'}
  - {t: '6', h: ^}
  - {t: '''', h: '"'}
  - LCTRL
  - {t: LEFT META, h: LEFT SHIFT}
  - {t: '`', h: LALT}
  - ','
  - .
  - {t: '0', h: )}
  - {t: '1', h: '!'}
  - {t: '2', h: '@'}
  - {t: '3', h: '#'}
  - {t: ADJ, h: toggle}
  - {t: BASE, h: toggle}
  - SPACE
  - HOME
  - END
  ADJ:
  - F1
  - F2
  - F3
  - F4
  - F5
  - BT CLR
  - {t: BT, h: '0'}
  - {t: BT, h: '1'}
  - {t: BT, h: '2'}
  - {t: BT, h: '3'}
  - F6
  - F7
  - F8
  - F9
  - F10
  - OUT BLE
  - OUT USB
  - ''
  - ''
  - VOLUME UP
  - F11
  - F12
  - ''
  - ''
  - ''
  - '&bootloader'
  - '&sys_reset'
  - ''
  - ''
  - VOLUME DOWN
  - {t: BASE, h: toggle}
  - LEFT ALT
  - RIGHT CONTROL
  - RIGHT SHIFT
combos:
- p: [0, 1]
  k: ESC
  l: [BASE]
- p: [13, 16]
  k: '&caps_word'
  l: [BASE]
- p: [7, 8]
  k: BSPC
  l: [BASE]
- p: [8, 9]
  k: DEL
  l: [BASE]
- p: [11, 12]
  k: TAB
  l: [BASE]
- p: [17, 18]
  k: RET
  l: [BASE]
- p: [16, 17]
  k: '&num_word 1'
  l: [BASE]
- p: [16, 26]
  k: '-'
  l: [BASE]
- p: [15, 25]
  k: _
  l: [BASE]
- p: [13, 23]
  k: '='
  l: [BASE]
- p: [11, 21]
  k: '`'
  l: [BASE]
- p: [30, 31]
  k: '&key_repeat'
  l: [NUM, BASE]
