CONFIG_ZMK_POINTING=y
CONFIG_ZMK_KEYBOARD_NAME="forager_sk"

# Tolerate stale GATT subscription state from the host after it sleeps —
# without this, macOS 26.5.2 fails to reconnect after wake until Bluetooth
# is toggled. The Corne config has this set and reconnects fine on the same
# Mac; same-shaped fix as the known Windows battery-report workaround.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Idle after 10 min, deep sleep after 2 h. Deep sleep drops the BLE link, and
# every "won't reconnect" episode on the Windows laptop (MediaTek MT7663
# adapter) started with the keyboard deep-sleeping during a 30-45 min laptop
# standby; on resume the host then had to rediscover the keyboard instead of
# resuming a live link. 2 h keeps the link up through ordinary laptop naps at
# the cost of some idle battery. The keypress that wakes a deep-sleeping half
# is not sent to the host.
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Let a host that has forgotten the keyboard re-pair to its own profile
# without BT_CLR first. ZMK otherwise rejects pairing to a profile that still
# holds a bond ("Rejecting pairing request to taken profile"), which is the
# "Device Association Failed - Enumerate Ceremonies" loop Windows shows after
# "Remove device". EXPERIMENTAL_SEC implies BT_SMP_ALLOW_UNAUTH_OVERWRITE,
# which in turn implies passkey entry; keep passkey entry off so pairing stays
# a one-click "Just Works" flow.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Boost BLE TX power — mitigates mid-session disconnects on the xiao_ble's
# marginal onboard antenna (central drops link, release event for the held
# key never reaches the host, so the host free-runs its own key-repeat).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Force 1M PHY — 2M PHY has known connection-stability issues with some
# Windows Bluetooth chipsets (Realtek/Intel) and can worsen a marginal link.
CONFIG_BT_CTLR_PHY_2M=n
